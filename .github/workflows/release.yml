name: Build, Sign & Notarize Release

# Läuft bei einem Tag-Push (z.B. `git push github vX.Y.Z`) oder manuell über
# den "Run workflow"-Button. Baut per `make app` (Release-Build), signiert
# mit dem Developer-ID-Zertifikat aus den Secrets, notarisiert bei Apple und
# hängt ein Drag-in-Applications-.dmg (make dmg) an eine neue GitHub Release.
#
# Voraussetzung: Xcode auf dem Runner muss die swift-tools-version aus
# Package.swift (aktuell 6.2, .macOS(.v26)) unterstützen. Falls der
# "Select Xcode"-Schritt fehlschlägt, in xcode-version unten eine konkrete
# Version statt "latest-stable" eintragen, sobald bekannt ist, welche
# GitHub-Runner-Images das SDK mitbringen.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Version aus Git-Tag in Info.plist übernehmen
        if: startsWith(github.ref, 'refs/tags/')
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RUN_NUMBER" App/Info.plist

      - name: Signing-Zertifikat in temporäre Keychain importieren
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          rm -f "$CERT_PATH"

      - name: App bauen & signieren (make app)
        env:
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: make app SIGN_IDENTITY="$SIGN_IDENTITY"

      - name: Bei Apple notarisieren
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/notary_key.p8"
          echo -n "$NOTARY_KEY_P8_BASE64" | base64 --decode -o "$KEY_PATH"

          ditto -c -k --keepParent "dist/MA Menubar.app" "$RUNNER_TEMP/MA-Menubar-submit.zip"

          xcrun notarytool submit "$RUNNER_TEMP/MA-Menubar-submit.zip" \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait

          xcrun stapler staple "dist/MA Menubar.app"
          rm -f "$KEY_PATH"

      - name: DMG bauen
        run: make dmg

      - name: Release-Artefakt benennen
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv "dist/MA Menubar.dmg" "out/MA-Menubar-${REF_NAME}.dmg"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: out/*.dmg

      - name: Homebrew-Cask-Formel aktualisieren
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          SHA256=$(shasum -a 256 "out/MA-Menubar-${REF_NAME}.dmg" | awk '{print $1}')

          # Der Checkout-Schritt oben steht auf dem gepushten Tag (detached
          # HEAD) — die Cask-Formel gehört aber auf main, dem Release-Spiegel-
          # Branch, nicht auf den Tag selbst.
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" Casks/ma-menubar.rb
          sed -i '' "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/ma-menubar.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/ma-menubar.rb
          if ! git diff --cached --quiet; then
            git commit -m "chore: Cask-Formel auf ${REF_NAME} aktualisieren"
            git push origin main
          fi
